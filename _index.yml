indexpage:
  title: Documentazione Keystone
  summary: Keystone STaaS è un'offerta in abbonamento della piattaforma NetApp Keystone
    che fornisce servizi di storage di file, blocchi e oggetti tramite un modello
    pay-as-you-go.
  keywords: NetApp Keystone, Keystone STaaS, storage as a service, subscription
  lead: NetApp Keystone è la piattaforma storage-as-a-service di NetApp. Keystone
    Storage-as-a-Service (STaaS), un'offerta in abbonamento nell'ambito di Keystone,
    fornisce servizi di storage per file, blocchi e oggetti tramite un modello pay-as-you-go.
    Keystone STaaS consente alle organizzazioni di utilizzare lo storage come costi
    operativi anziché effettuare un investimento iniziale in conto capitale.
